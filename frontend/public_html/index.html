<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock AI Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Навигация -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex gap-6 font-medium">
                <a href="/" class="text-blue-600 border-b-2 border-blue-600">Аналитика</a>
                <a href="/backtest.html" class="text-gray-500 hover:text-blue-600 transition">Бэктест</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- Блок поиска -->
        <div class="bg-white p-8 rounded-3xl shadow-sm border mb-8 flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-[2] w-full">
                <label class="block text-sm font-semibold text-gray-500 mb-2 uppercase tracking-wider">Введите тикер</label>
                <input id="tickerInput" type="text" placeholder="Например: AAPL, BTC-USD" 
                    class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition text-lg font-bold">
            </div>
            <div class="flex-1 w-full">
                <label class="block text-sm font-semibold text-gray-500 mb-2 uppercase tracking-wider">Дней прогноза</label>
                <input id="daysInput" type="number" value="7" min="1" max="30"
                    class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition text-lg font-bold">
            </div>
            <button onclick="fetchData()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-2xl font-bold transition-all shadow-lg shadow-blue-200">
                Анализировать
            </button>
        </div>
        <!-- Блок выбора периода -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar" id="periodSelector">
            <button onclick="changePeriod('6mo')" class="period-btn px-4 py-2 bg-white border border-gray-200 rounded-xl text-xs font-bold hover:bg-gray-50 transition shadow-sm" data-period="6mo">6 МЕС</button>
            <button onclick="changePeriod('1y')" class="period-btn active-period px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-100" data-period="1y">1 ГОД</button>
            <button onclick="changePeriod('2y')" class="period-btn px-4 py-2 bg-white border border-gray-200 rounded-xl text-xs font-bold hover:bg-gray-50 transition shadow-sm" data-period="2y">2 ГОДА</button>
        </div>

        <style>
            .active-period {
                background-color: #2563eb !important;
                color: white !important;
                border-color: #2563eb !important;
            }
        </style>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Левая колонка: График -->
            <div class="lg:col-span-2 bg-white p-8 rounded-3xl shadow-sm border">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="stockName" class="text-2xl font-bold text-gray-800 italic">Выберите акцию...</h2>
                    <span id="stockCurrency" class="px-3 py-1 bg-gray-100 text-gray-500 rounded-lg text-sm font-bold">---</span>
                </div>
                <div class="relative h-[400px]">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- Правая колонка: AI Прогноз -->
            <div class="space-y-6">
                <!-- Секция выбора модели (она у вас уже есть) -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border mb-6">
                    <h3 class="text-gray-400 font-bold uppercase text-xs tracking-widest mb-4">Выберите архитектуру ИИ</h3>
                    <div class="flex flex-col gap-2" id="modelSelector">
                        <!-- GRU -->
                        <button onclick="selectModel('gru')" id="btn_gru" 
                                class="model-btn flex justify-between items-center p-4 rounded-2xl border-2 border-transparent bg-gray-50 hover:bg-gray-100 transition-all">
                            <span class="font-bold"><span id="name_gru">GRU</span> <span id="rec_gru" class="text-blue-500 ml-1"></span></span>
                            <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded-md">Fast</span>
                        </button>
                        
                        <!-- LSTM -->
                        <button onclick="selectModel('lstm')" id="btn_lstm" 
                                class="model-btn flex justify-between items-center p-4 rounded-2xl border-2 border-transparent bg-gray-50 hover:bg-gray-100 transition-all">
                            <span class="font-bold"><span id="name_lstm">LSTM</span> <span id="rec_lstm" class="text-blue-500 ml-1"></span></span>
                            <span class="text-xs bg-gray-200 text-gray-500 px-2 py-1 rounded-md">Stable</span>
                        </button>

                        <!-- CNN -->
                        <button onclick="selectModel('cnn')" id="btn_cnn" 
                                class="model-btn flex justify-between items-center p-4 rounded-2xl border-2 border-transparent bg-gray-50 hover:bg-gray-100 transition-all">
                            <span class="font-bold"><span id="name_cnn">CNN</span> <span id="rec_cnn" class="text-blue-500 ml-1"></span></span>
                            <span class="text-xs bg-gray-200 text-gray-500 px-2 py-1 rounded-md">Legacy</span>
                        </button>
                    </div>
                </div>

                <!-- ДОБАВЬТЕ ЭТОТ БЛОК НИЖЕ (Карточка результата) -->
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-t-8 border-t-blue-500">
                    <h3 class="text-gray-400 font-bold uppercase text-xs tracking-widest mb-4">AI Recommendation</h3>
                    
                    <!-- Этот блок будет скрыт во время загрузки -->
                    <div id="predictionContent" class="hidden">
                        <div id="signalBadge" class="text-3xl font-black mb-2 italic text-gray-800">---</div>
                        <p class="text-sm text-gray-500 font-medium">Анализ завершен на основе выбранной архитектуры нейросети.</p>
                        <hr class="my-6 border-gray-100">
                        <div class="flex justify-between text-xs font-bold text-gray-400 uppercase tracking-tighter">
                            <span>Статус: Актуально</span>
                            <span>Data: 60 days</span>
                        </div>
                    </div>

                    <!-- Этот блок (Лоадер) будет виден, пока идет запрос -->
                    <div id="predictionLoader" class="text-gray-300 py-10 text-center italic">
                        <div class="inline-block animate-spin w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-4"></div>
                        <p class="text-sm font-medium">Ожидание данных...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
let mainChartInstance = null;
let currentModel = 'gru';
let currentPeriod = '1y';
let lastTicker = ""; 

function selectModel(modelType) {
    currentModel = modelType.replace('model_', '');
    
    // 2. Сбрасываем ВСЕ кнопки (и классы, и принудительные стили JS)
    document.querySelectorAll('.model-btn').forEach(btn => {
        // Убираем классы активности
        btn.classList.remove('active-model', 'border-blue-500', 'bg-blue-50', 'ring-2', 'ring-blue-400');
        btn.classList.add('border-transparent', 'bg-gray-50');
        
        // ВАЖНО: Очищаем инлайновые стили, которые добавила функция рекомендации
        btn.style.borderColor = '';
        btn.style.backgroundColor = '';
    });
    
    // 3. Устанавливаем стиль для ВЫБРАННОЙ кнопки
    const activeBtn = document.getElementById('btn_' + currentModel);
    if (activeBtn) {
        activeBtn.classList.add('active-model', 'border-blue-500', 'bg-white');
        activeBtn.classList.remove('border-transparent', 'bg-gray-50');
        // Принудительно красим рамку выбранной модели
        activeBtn.style.borderColor = '#3b82f6'; 
    }

    // 4. Загружаем данные для новой модели (без повторного бэктеста)
    if (document.getElementById('tickerInput').value) {
        fetchData(true); 
    }
}

// 2. Главная функция
async function fetchData(skipBacktest = false) {
    const tickerInput = document.getElementById('tickerInput');
    const ticker = tickerInput ? tickerInput.value.trim().toUpperCase() : "";
    const days = parseInt(document.getElementById('daysInput').value) || 7;
    
    if (!ticker) return alert("Введите тикер");

    showLoader(true);

    try {
        const baseUrl = window.location.origin;
        const encodedTicker = encodeURIComponent(ticker);

        // --- ШАГ 1: БЭКТЕСТ (Только если тикер новый или мы нажали "Анализировать") ---
        // Если мы просто переключаем модель, этот блок пропустится
        if (!skipBacktest || ticker !== lastTicker) {
            resetModelUI(); // Убираем старые плашки "Рекомендуемо"
            
            try {
                // Путь с учетом префикса в твоем FastAPI
                const bRes = await fetch(`${baseUrl}/api/backtest/run/${encodedTicker}?days=100`);
                if (bRes.ok) {
                    const bData = await bRes.json();
                    let winnerModel = 'gru';
                    let maxProfit = -Infinity;

                    if (bData.results) {
                        Object.entries(bData.results).forEach(([mName, stats]) => {
                            const profit = stats.profit_pct || stats.total_return || 0;
                            if (profit > maxProfit) {
                                maxProfit = profit;
                                winnerModel = mName;
                            }
                        });
                        updateModelBadges(winnerModel);
                        lastTicker = ticker; // Запоминаем тикер
                    }
                }
            } catch (bErr) {
                console.warn("Фоновый анализ не удался:", bErr);
            }
        }

        // --- ШАГ 2: ИСТОРИЯ И ПРОГНОЗ (Делаем всегда) ---
        const [hRes, pRes] = await Promise.all([
            fetch(`${baseUrl}/api/stock/data/${encodedTicker}?period=${currentPeriod}`),
            fetch(`${baseUrl}/api/predict-future/${encodedTicker}?model_type=${currentModel}&days=${days}`)
        ]);

        if (!hRes.ok) throw new Error('История не найдена');
        if (!pRes.ok) throw new Error('Прогноз не найден');

        const hData = await hRes.json();
        const pData = await pRes.json();

        // Подготовка данных для графика
        const labelsArr = Object.keys(hData.time_series).sort(); 
        const pricesArr = labelsArr.map(d => parseFloat(hData.time_series[d]["4. close"]));
        const currentPrice = pricesArr[pricesArr.length - 1];

        // Обновляем UI
        document.getElementById('stockName').innerText = hData.symbol || ticker;
        renderMainChart(labelsArr, pricesArr, pData.dates, pData.prices, pData.history_prices || []);
        updateRecommendation(pData.signal, currentPrice, pData.prices);

    } catch (err) {
        console.error("Критическая ошибка:", err);
        alert("Ошибка: " + err.message);
    } finally {
        showLoader(false);
    }
}

// 3. Сброс интерфейса
function resetModelUI() {
    ['gru', 'lstm', 'cnn'].forEach(m => {
        const badge = document.getElementById(`rec_${m}`);
        if (badge) badge.innerText = '';
        const btn = document.getElementById(`btn_${m}`);
        if (btn) {
            btn.style.borderColor = 'transparent';
            btn.style.backgroundColor = '#f9fafb';
        }
    });
}

// 4. Обновление плашек
function updateModelBadges(bestModel) {
    const models = ['gru', 'lstm', 'cnn'];
    models.forEach(m => {
        const badge = document.getElementById(`rec_${m}`);
        const btn = document.getElementById(`btn_${m}`);
        if (m === bestModel) {
            if (badge) badge.innerText = '(Рекомендуемо)';
            if (btn) {
                btn.style.borderColor = '#3b82f6';
                btn.style.backgroundColor = '#eff6ff';
            }
        }
    });
}

// Остальные функции (renderMainChart, updateRecommendation, showLoader) оставь как были
// 3. Функция отрисовки (Только рисует то, что ей дали)
function renderMainChart(hLabels, hPrices, fLabels, fPrices, hForecast) {
    const ctx = document.getElementById('mainChart').getContext('2d');
    
    if (mainChartInstance) {
        mainChartInstance.destroy();
    }

    // Стык линий
    const offset = hPrices.length - hForecast.length;
    const aiPathData = new Array(offset).fill(null)
        .concat(hForecast)
        .concat(fPrices);

    mainChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [...hLabels, ...fLabels],
            datasets: [
                {
                    label: 'Реальность',
                    data: hPrices,
                    borderColor: '#2563eb',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Прогноз ИИ',
                    data: aiPathData,
                    borderColor: '#8b5cf6',
                    borderWidth: 3,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: 'rgba(139, 92, 246, 0.05)',
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { position: 'right', ticks: { callback: v => '$' + v.toFixed(2) } },
                x: { ticks: { maxTicksLimit: 10, maxRotation: 0 } }
            },
            plugins: {
                legend: { position: 'top' }
            }
        }
    });
}

function updateRecommendation(sig, currentPrice, futurePrices) {
    const badge = document.getElementById('signalBadge');
    const content = document.getElementById('predictionContent');
    
    // Пытаемся найти или создать элемент для доходности
    let profitEl = document.getElementById('potentialProfit');
    if (!profitEl) {
        profitEl = document.createElement('div');
        profitEl.id = 'potentialProfit';
        profitEl.className = 'text-lg font-bold mt-2';
        // Вставляем его после заголовка (badge)
        if (badge) badge.parentNode.insertBefore(profitEl, badge.nextSibling);
    }

    if (content) content.className = 'bg-white p-8 rounded-3xl shadow-sm border border-t-8 border-t-blue-500';
    
    if (badge && sig && futurePrices && futurePrices.length > 0) {
        const isBuy = sig.toUpperCase() === 'BUY';
        
        // РАСЧЕТ ДОХОДНОСТИ
        const lastPredictedPrice = futurePrices[futurePrices.length - 1];
        let profitPct = ((lastPredictedPrice / currentPrice) - 1) * 100;
        
        // Если сигнал SELL, инвертируем профит для логики шорта
        if (!isBuy) profitPct = -profitPct;

        // Вычитаем комиссию 0.15%
        const netProfit = profitPct - 0.15;

        // Текст сигнала
        badge.innerText = isBuy ? 'ПОКУПАТЬ' : 'ПРОДАВАТЬ';
        badge.className = 'text-4xl font-black mb-1 italic tracking-tighter ' + (isBuy ? 'text-green-500' : 'text-red-500');
        
        // Текст доходности
        profitEl.innerText = `Ожидаемый профит: ${netProfit > 0 ? '+' : ''}${netProfit.toFixed(2)}%`;
        profitEl.className = netProfit > 0 ? 'text-green-600 opacity-80' : 'text-red-600 opacity-80';
    }
}

function showLoader(show) {
    const loader = document.getElementById('predictionLoader');
    const content = document.getElementById('predictionContent');
    if (loader) loader.className = show ? 'py-10 text-center' : 'py-10 text-center hidden';
    if (content && show) content.className = 'hidden';
}
    </script>
</body>
</html>
